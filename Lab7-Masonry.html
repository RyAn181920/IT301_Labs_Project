<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masonry</title>
    <style>
    Body{
        display: flex;
    }
    #Right{
    overflow-y: auto;
    flex-wrap: wrap;
    display: flex;
    height: 100vh;
    width: 100%;
    gap: 2px;
    align-content: flex-start;
    }
    #Right img {
        width: 200px;
        max-width: 100%;
        height: auto;
        object-fit: cover;
        flex-grow: 1;
    }
    #Left{
        height: 100vh;
        width: 90px;
        margin-left: 0px;
        background-color: orange;
        flex-direction: column;
        display: flex;
        flex-shrink: 0;
        align-items: center;
    }
    #Camera{
            align-self: flex-start;
            font-size: 50px;
            margin-top: 10px;
        }
    #Bin{
            align-self: flex-start;
            font-size: 50px;
            margin-top: -40px;
        }
    #Heart{
            align-self: flex-start;
            font-size: 50px;
            margin-top: -50px;
        }
    #Trash{
            align-self: flex-start;
            font-size: 50px;
            margin-top: auto;
            
        }
    </style>
</head>
<body>
    <div id="Left">
        <p id="Camera">&#x1F4F7;</p>
        <p id="Bin">&#x1F5C4;&#xfe0f;</p>
        <p id="Heart">&#x2764;&#xfe0f;</p>
        <p id="Trash">&#x1F5D1;&#xfe0f;</p>
    </div>
    <div id="Right">
        <img src="https://picsum.photos/100/100?random=1" alt=" ">
        <img src="https://picsum.photos/220/150?random=2" alt=" ">
        <img src="https://picsum.photos/150/100?random=3" alt=" ">
        <img src="https://picsum.photos/150/150?random=4" alt=" ">
        <img src="https://picsum.photos/200/100?random=5" alt=" ">
        <img src="https://picsum.photos/200/100?random=6" alt=" ">
        <img src="https://picsum.photos/150/100?random=7" alt=" ">
        <img src="https://picsum.photos/200/100?random=8" alt=" ">
        <img src="https://picsum.photos/150/100?random=9" alt=" ">
        <img src="https://picsum.photos/250/100?random=10" alt=" ">
        <img src="https://picsum.photos/150/100?random=11" alt=" ">
        <img src="https://picsum.photos/200/150?random=12" alt=" ">
        <img src="https://picsum.photos/150/100?random=13" alt=" ">
        <img src="https://picsum.photos/250/100?random=14" alt=" ">
        <img src="https://picsum.photos/50/100?random=15" alt=" ">
        <img src="https://picsum.photos/200/150?random=16" alt=" ">
        <img src="https://picsum.photos/150/150?random=17" alt=" ">
        <img src="https://picsum.photos/200/100?random=18" alt=" ">
        <img src="https://picsum.photos/150/100?random=19" alt=" ">
        <img src="https://picsum.photos/50/100?random=20" alt=" ">
    </div>
</body>
</html>
