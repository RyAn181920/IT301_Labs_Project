<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
    </style>
</head>
<body>
    <form action = "#">
        <Label for = "name">What is your name?</Label>
        <input type="text" id="name"> <br><br>
        <button id ="bttn" type="button">Submit Name</button> 
    </form>
    <p id="greet"></p>
    <br>
    <p>Insert your two numbers here!</p>
    <form action = "#">
        <Label for = "number1">What is your first number?</Label>
        <input type="number" id="number1"> <br><br>
        <button id="bttn2" type="button">Submit #1</button>
    </form>
    <p id = "first"></p>

    <form action = "#">
        <Label for = "number2">What is your second number?</Label>
        <input type="number" id="number2"> <br><br>
        <button id="bttn3" type="button">Submit #2</button>
    </form>
    <p id = "second"></p>
    <br>
    <br>
    <p>What math operation would you like to use?</p>
    <form action="#">
        <input type="radio" name = "math" value="add">Add<br>
        <input type="radio" name = "math" value="subtract">Subtract<br>
        <input type="radio" name = "math" value="multiply">Multiply<br>
        <input type="radio" name = "math" value="divide">Divide<br>
        <br><br>
        <button type ="button" id="calculate">Calculate</button>
        <button type="button" id="clear">Clear</button>
    </form>
    <p id ="answer"></p>
    <script>
        const name = document.getElementById('name')
        const result1 = document.getElementById('result')

        document.getElementById("bttn").addEventListener('click', function(){
            document.getElementById("greet").textContent="Hello" +" "+ name.value + "!"
        })

        const number1 = document.getElementById('number1')
        const result2 = document.getElementById('result2')

        document.getElementById("bttn2").addEventListener('click', function(){
            document.getElementById('first').textContent="Your first number is " + number1.value
        })

        const number2 = document.getElementById('number2');
        const result3 = document.getElementById('result2');

        document.getElementById("bttn3").addEventListener('click', function(){
            document.getElementById('second').textContent="Your second number is " + number2.value
        })
        document.getElementById("calculate").addEventListener("click", function(){
            const num1 = Number(document.getElementById("number1").value);
            const num2 = Number(document.getElementById("number2").value);
            const operation = document.querySelector('input[name="math"]:checked');
        let result;

        if (operation.value === "add"){
            result = num1 + num2;
        }
        else if (operation.value === "subtract"){
            result = num1-num2;
        }
        else if (operation.value === "multiply"){
            result = num1 * num2;
        }
        else if (operation.value === "divide"){
            if (num2 === 0){
                document.getElementById("answer").textContent = "Error, cannot divide by 0. Please try again."
            }
            result = num1 / num2;
        }
        document.getElementById("answer").textContent = "Your answer is "+ result;
    });
    
    document.getElementById("clear").addEventListener("click", function(){
        document.getElementById("name").value= "";
        document.getElementById("number1").value= "";
        document.getElementById("number2").value= "";
        document.getElementById("greet").value= "";
        document.getElementById("first").value= "";
        document.getElementById("second").value= "";
        document.getElementById("answer").value= "";
    })
    

    </script>
</body>
</html>
