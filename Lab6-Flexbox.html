<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        #parent{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

    </style>
</head>
<body>
    <div id="parent">
        <div id="child1"><img src="https://picsum.photos/150/100?random=1" alt=" "></div>
        <div id="child2"><img src="https://picsum.photos/150/200?random=2" alt=" "></div>
        <div id="child3"><img src="https://picsum.photos/150/100?random=3" alt=" "></div>
    </div>
</body>
</html>
